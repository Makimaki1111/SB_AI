<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIタイプ付けしりとりバトル - 対戦中</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- バトル画面 -->
  <div id="battle-screen">
    <div class="phone-box">
      <div class="top-image">
        <img src="img/ground.jpg" alt="背景画像" />

        <!-- 白い楕円（左下） -->
        <div class="ellipse ellipse-left"></div>

        <!-- 右下ふきだし -->
        <div class="balloon right">
          <div class="ally-name"></div>
          <div class="bar"><div class="ally-hp-bar"></div></div>
          <div class="hp"></div>
        </div>

        <img id="ally-type1-img" src=""/>
        <img id="ally-type2-img" src=""/>
        <img id="ally-only-type-img" src=""/>
        <div class="ally-word"></div>

        <!-- 白い楕円（右上） -->
        <div class="ellipse ellipse-right"></div>

        <!-- 左上ふきだし -->
        <div class="balloon left">
          <div class="foe-name"></div>
          <div class="bar"><div class="foe-hp-bar"></div></div>
          <div class="hp"></div>
        </div>

        <img id="foe-type1-img" src=""/>
        <img id="foe-type2-img" src=""/>
        <img id="foe-only-type-img" src=""/>
        <div class="foe-word"></div>
      </div>

      <div class="content">
        <!-- アクションエリア: タイマー、メッセージ、入力 -->
        <div class="action-area">
          <div class="input-wrapper">
            <div id="timer-container"><div id="timer-bar"></div></div>
            <div id="text">
              <input type="text" id="input" autocomplete="off" placeholder="「」からはじまることば" />
              <button type="submit" id="submit">▶</button>
              <img id="include-img" src="" alt="動的画像" />
            </div>
            <div id="message"></div>
            <div id="wait-message"></div>
          </div>
          <!-- 特性情報表示エリア -->
          <div id="ability-info-container">
            <p>
                現在の特性: <strong id="current-ability-name">---</strong>
            </p>
            <p>
                変更回数: <span id="ability-change-count">0</span> 回
            </p>
            <button id="open-ability-modal-btn" disabled>特性を変更する</button>
          </div>
        </div>
        <a href="index.html" id="back-to-title-btn" style="display:none;">タイトルに戻る</a>
        <!-- フッターエリア: ボタン類 -->
        <div class="footer-area">
          <button id="cancel-battle-btn">にげる</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="type_to_image.js"></script>
  <script src="UIObject.js"></script>
  <script src="UI.js"></script>
  <script src="script.js"></script>
  <!-- 特性選択モーダル (通常は非表示) -->
  <div id="ability-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>特性を選択してください</h2>
            <button id="close-modal-btn" class="close-button">&times;</button>
        </div>
        <div id="ability-list" class="modal-body">
            <!-- ここにJavaScriptで特性のリストが生成されます -->
        </div>
        <div class="modal-footer">
            <p>※現在の特性は選択できません。変更すると回数を1消費します。</p>
        </div>
    </div>
  </div>
</body>
</html>
