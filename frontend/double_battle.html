<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        (function ensureIframeShellEarly() {
            const page = 'double_battle.html';
            const toShell = (targetPage) => {
                window.location.replace(`index.html#${targetPage}`);
            };

            if (window.self === window.top) {
                const hashPage = (window.location.hash || '').replace(/^#/, '');
                const target = hashPage === 'single_battle.html' ? 'single_battle.html' : page;
                toShell(target);
                return;
            }
            try {
                if (window.parent && window.parent.location.hash !== `#${page}`) {
                    window.parent.location.hash = page;
                }
            } catch (e) {
                // noop
            }
        })();
    </script>
    <title>ダブルバトル (β版)</title>
    <link rel="stylesheet" href="style.css?v=14" />
    <link rel="stylesheet" href="double_style.css?v=8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- ダブルバトル ロビー画面 -->
    <div id="double-lobby-screen" style="display: block;">
        <div class="phone-box">
            <div class="content">
                <h1>ダブルバトル ロビー</h1>

                <!-- メニューボタン群をコンテナでラップして重なりと間隔を管理 -->
                <div class="title-buttons-container" style="margin-top: 50px;">
                    <div
                        style="width: 72%; max-width: 340px; padding: 20px; border: 1px solid #eee; border-radius: 16px; background: rgba(255,255,255,0.9); box-shadow: 0 4px 15px rgba(0,0,0,0.05); box-sizing: border-box;">
                        <h3 style="margin-top: 0; margin-bottom: 5px; color: #333; text-align: center;">モード選択</h3>
                        <div class="mode-select-container">
                            <label class="mode-select-btn active">
                                <input type="radio" name="double_mode" value="1v1_double" checked
                                    onchange="updateModeSelection(this)">
                                1人2役 (計2名)
                            </label>
                            <label class="mode-select-btn disabled">
                                <input type="radio" name="double_mode" value="2v2_double" disabled
                                    onchange="updateModeSelection(this)">
                                4人協力対戦 (未開発)
                            </label>
                        </div>
                    </div>

                    <!-- CPU戦(デバッグ用) -->
                    <button id="cpu-double-battle-btn" class="button-lobby" style="margin-top: 10px;">コンピュータ戦</button>

                    <hr style="width: 80%; border-top: 1px solid #ccc; margin: 0;">

                    <a id="create-double-room-btn" class="button-lobby">ルームを作成する</a>

                    <div
                        style="display: flex; gap: 8px; align-items: center; width: 72%; max-width: 340px; margin: 0 auto; box-sizing: border-box;">
                        <input type="text" id="double-room-id-input" placeholder="ルームID"
                            style="flex-grow: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; box-sizing: border-box;">
                        <button id="join-double-room-btn"
                            style="padding: 10px 16px; border-radius: 8px; border: none; background: linear-gradient(180deg, #81c784, #4caf50); color: white; font-size: 1rem; font-weight: 700; cursor: pointer; white-space: nowrap; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">参加する</button>
                    </div>

                    <div id="lobby-message" style="color: #333; font-weight: bold; text-align: center;">
                    </div>

                    <a id="lobby-back-btn" href="#single_battle.html" class="button-lobby"
                        style="background: linear-gradient(180deg, #f0f0f0, #d4d4d4); color: #333; margin-bottom: 20px;">タイトルに戻る</a>
                </div>
            </div>
        </div>
    </div>

    <!-- ダブルバトル 対戦画面 (初期非表示) -->
    <div id="double-battle-screen" style="display: none;">
        <div class="phone-box">
            <div class="top-image" id="double-top-image">
                <img src="img/ground.jpg" alt="背景画像" />

                <!-- ＝＝ 自分サイド (左下) ＝＝ -->
                <!-- キャラ表示用コンテナ -->
                <div class="double-char-container bottom-left">
                    <div class="double-ellipse" id="ellipse-ally"></div>
                    <!-- 自キャラA (左・手前) -->
                    <div class="char-wrapper" id="char-p1a-wrapper">
                        <img id="p1a-img-1" class="char-sprite" src="" style="display:none;" />
                        <img id="p1a-img-2" class="char-sprite type2-sprite" src="" style="display:none;" />
                        <div class="double-word" id="p1a-word"></div>
                        <div id="p1a-effect-container" class="effect-container"></div>
                    </div>
                    <!-- 自キャラB (右・奥) -->
                    <div class="char-wrapper" id="char-p1b-wrapper">
                        <img id="p1b-img-1" class="char-sprite" src="" style="display:none;" />
                        <img id="p1b-img-2" class="char-sprite type2-sprite" src="" style="display:none;" />
                        <div class="double-word" id="p1b-word"></div>
                        <div id="p1b-effect-container" class="effect-container"></div>
                    </div>
                </div>

                <!-- 自分サイド情報ウィンドウ (1つのバルーンに統合) -->
                <div class="balloon right double-balloon" id="team1-balloon">
                    <div class="team-info">
                        <div class="member-info">
                            <span class="member-name" id="p1a-name">じぶん(A)</span>
                            <div class="bar double-hp-box">
                                <div class="ally-hp-bar" id="p1a-hp-bar"></div>
                            </div>
                            <div class="hp double-hp-text" id="p1a-hp-text"></div>
                        </div>
                        <div class="member-info">
                            <span class="member-name" id="p1b-name">じぶん(B)</span>
                            <div class="bar double-hp-box">
                                <div class="ally-hp-bar" id="p1b-hp-bar"></div>
                            </div>
                            <div class="hp double-hp-text" id="p1b-hp-text"></div>
                        </div>
                    </div>
                </div>

                <!-- ＝＝ 敵サイド (右上) ＝＝ -->
                <!-- キャラ表示用コンテナ -->
                <div class="double-char-container top-right">
                    <div class="double-ellipse" id="ellipse-enemy"></div>
                    <!-- 敵キャラA (左・手前) -->
                    <div class="char-wrapper" id="char-p2a-wrapper">
                        <img id="p2a-img-1" class="char-sprite" src="" style="display:none;" />
                        <img id="p2a-img-2" class="char-sprite type2-sprite" src="" style="display:none;" />
                        <div class="double-word" id="p2a-word"></div>
                        <div id="p2a-effect-container" class="effect-container"></div>
                    </div>
                    <!-- 敵キャラB (右・奥) -->
                    <div class="char-wrapper" id="char-p2b-wrapper">
                        <img id="p2b-img-1" class="char-sprite" src="" style="display:none;" />
                        <img id="p2b-img-2" class="char-sprite type2-sprite" src="" style="display:none;" />
                        <div class="double-word" id="p2b-word"></div>
                        <div id="p2b-effect-container" class="effect-container"></div>
                    </div>
                </div>

                <!-- 敵サイド情報ウィンドウ (1つのバルーンに統合) -->
                <div class="balloon left double-balloon" id="team2-balloon">
                    <div class="team-info">
                        <div class="member-info">
                            <span class="member-name" id="p2a-name">あいて(A)</span>
                            <div class="bar double-hp-box">
                                <div class="foe-hp-bar" id="p2a-hp-bar"></div>
                            </div>
                            <div class="hp double-hp-text" id="p2a-hp-text"></div>
                        </div>
                        <div class="member-info">
                            <span class="member-name" id="p2b-name">あいて(B)</span>
                            <div class="bar double-hp-box">
                                <div class="foe-hp-bar" id="p2b-hp-bar"></div>
                            </div>
                            <div class="hp double-hp-text" id="p2b-hp-text"></div>
                        </div>
                    </div>
                </div>

            </div>

            <div class="content">
                <!-- アクションエリア -->
                <div class="action-area">
                    <div class="input-wrapper" id="input-wrapper">
                        <div id="timer-container">
                            <div id="timer-bar"></div>
                        </div>
                        <div id="text">
                            <input type="text" id="input" autocomplete="off" placeholder="「」からはじまることば" />
                            <button type="submit" id="submit">▶</button>
                            <img id="include-img" src="" alt="動的画像" />
                        </div>
                        <div id="message"></div>
                        <div id="wait-message"></div>
                    </div>

                    <!-- ★ 新規追加: ターゲット選択UI (専用の高さ確保ラッパー) -->
                    <div
                        style="height: 46px; display: flex; align-items: center; justify-content: center; margin-top: 6px;">
                        <div id="target-selection-ui"
                            style="display: none; justify-content: center; align-items: center; gap: 12px; padding: 6px 12px; background: rgba(255,255,255,0.7); border-radius: 12px; box-sizing: border-box; width: 85%;">
                            <div style="font-size: 0.9em; font-weight: bold; color: #444;">ターゲット:</div>
                            <button class="target-btn" id="target-p2a-btn">あいてA</button>
                            <button class="target-btn" id="target-p2b-btn">あいてB</button>
                        </div>
                    </div>

                    <!-- アクションボタンエリア -->
                    <div id="actions-wrapper">
                        <div id="situation-button">
                            <p>じょうきょう</p>
                        </div>
                        <div id="ability-info-container">
                            <p>とくせい</p>
                        </div>
                    </div>
                </div>

                <a id="back-to-title-btn" style="display:none;" href="#single_battle.html">タイトルに戻る</a>
                <!-- フッターエリア: ボタン類 -->
                <div class="footer-area">
                    <button id="cancel-battle-btn" style="position: relative; z-index: 100;">にげる</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ダブルバトル用 状況確認モーダル -->
    <div id="situation-modal" style="display: none;">
        <div style="display: flex; justify-content: space-between; width: 100%;">
            <!-- Left: Own Team -->
            <div style="text-align: left; width: 45%;">
                <h3 style="margin-top: 5px; margin-bottom: 10px; border-bottom: 2px solid #ccc;">じぶんチーム</h3>
                <div id="s-p1a-info" style="margin-bottom: 10px;">
                    <h4 style="margin: 0; color: #ff5722;" id="s-p1a-name">じぶんA</h4>
                    <p style="margin: 0; font-size: 0.9em;">こうげき: <span id="s-p1a-atk">1.0倍</span></p>
                    <p style="margin: 0; font-size: 0.9em;">ぼうぎょ: <span id="s-p1a-def">1.0倍</span></p>
                </div>
                <div id="s-p1b-info">
                    <h4 style="margin: 0; color: #ff5722;" id="s-p1b-name">じぶんB</h4>
                    <p style="margin: 0; font-size: 0.9em;">こうげき: <span id="s-p1b-atk">1.0倍</span></p>
                    <p style="margin: 0; font-size: 0.9em;">ぼうぎょ: <span id="s-p1b-def">1.0倍</span></p>
                </div>
            </div>
            <!-- Right: Opponent Team -->
            <div style="text-align: right; width: 45%;">
                <h3 style="margin-top: 5px; margin-bottom: 10px; border-bottom: 2px solid #ccc;">あいてチーム</h3>
                <div id="s-p2a-info" style="margin-bottom: 10px;">
                    <h4 style="margin: 0; color: #00bcd4;" id="s-p2a-name">あいてA</h4>
                    <p style="margin: 0; font-size: 0.9em;">こうげき: <span id="s-p2a-atk">1.0倍</span></p>
                    <p style="margin: 0; font-size: 0.9em;">ぼうぎょ: <span id="s-p2a-def">1.0倍</span></p>
                </div>
                <div id="s-p2b-info">
                    <h4 style="margin: 0; color: #00bcd4;" id="s-p2b-name">あいてB</h4>
                    <p style="margin: 0; font-size: 0.9em;">こうげき: <span id="s-p2b-atk">1.0倍</span></p>
                    <p style="margin: 0; font-size: 0.9em;">ぼうぎょ: <span id="s-p2b-def">1.0倍</span></p>
                </div>
            </div>
        </div>
        <div class="close-modal" id="close-situation-modal-btn" style="margin-top: 15px;">とじる</div>
    </div>

    <!-- ダブルバトル用 特性確認モーダル -->
    <div id="ability-modal" style="display: none;">
        <!-- モーダルメッセージ -->
        <div id="double-modal-message"></div>
        <!-- 自分チームのとくせい (選択可能) -->
        <div style="margin-bottom: 12px;">
            <div id="ability-tab-p1a" class="ability-tab-content">
                <div style="margin-bottom: 6px;">
                    <span style="font-weight:bold;" id="a-p1a-name">じぶんA</span>
                    <span class="tokusei-name" id="a-p1a-ability-name"
                        style="color:#ff5722;font-weight:bold;margin-left:8px;">---</span>
                </div>
                <div class="tokusei-desc" id="a-p1a-ability-desc" style="font-size:0.8em;color:#666;margin-bottom:6px;">
                </div>
                <div style="font-size:0.85em;color:#888;">タップしてとくせいを変える <span id="a-p1a-remain">(あと0回)</span></div>
                <div id="a-p1a-skills" class="double-skills-list"></div>
            </div>
            <div id="ability-tab-p1b" class="ability-tab-content" style="display:none;">
                <div style="margin-bottom: 6px;">
                    <span style="font-weight:bold;" id="a-p1b-name">じぶんB</span>
                    <span class="tokusei-name" id="a-p1b-ability-name"
                        style="color:#ff5722;font-weight:bold;margin-left:8px;">---</span>
                </div>
                <div class="tokusei-desc" id="a-p1b-ability-desc" style="font-size:0.8em;color:#666;margin-bottom:6px;">
                </div>
                <div style="font-size:0.85em;color:#888;">タップしてとくせいを変える <span id="a-p1b-remain">(あと0回)</span></div>
                <div id="a-p1b-skills" class="double-skills-list"></div>
            </div>

            <div style="display: flex; gap: 8px; margin-top: 15px;">
                <button class="char-tab active" id="tab-p1a" onclick="switchAbilityTab('p1a')">じぶんA</button>
                <button class="char-tab" id="tab-p1b" onclick="switchAbilityTab('p1b')">じぶんB</button>
            </div>
        </div>

        <div class="close-modal" id="close-ability-modal-btn">とじる</div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/wanakana"></script>
    <script src="type_to_image.js"></script>
    <script src="shared_audio.js"></script>
    <script src="audio_bridge.js"></script>
    <!-- UIとベースロジックを流用 -->
    <script src="UIObject.js"></script>
    <script>
        function navigateInShell(page) {
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'sb:navigate', page }, '*');
                    return;
                }
            } catch (e) {
                // noop
            }
            window.location.href = `index.html#${page}`;
        }

        function updateModeSelection(radio) {
            document.querySelectorAll('.mode-select-btn').forEach(lbl => lbl.classList.remove('active'));
            if (radio.checked) {
                radio.closest('.mode-select-btn').classList.add('active');
            }
        }

        const lobbyBackBtn = document.getElementById('lobby-back-btn');
        if (lobbyBackBtn) {
            lobbyBackBtn.addEventListener('click', (e) => {
                e.preventDefault();
                navigateInShell('single_battle.html');
            });
        }

        const backToTitleBtn = document.getElementById('back-to-title-btn');
        if (backToTitleBtn) {
            backToTitleBtn.addEventListener('click', (e) => {
                e.preventDefault();
                navigateInShell('single_battle.html');
            });
        }
    </script>
    <script src="double_UI.js?v=4"></script>
    <script src="double_script.js?v=7"></script>

</body>

</html>
