<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content" />
    <script>
        (function ensureIframeShellEarly() {
            const page = 'double_battle.html';
            const toShell = (targetPage) => {
                window.location.replace(`index.html#${targetPage}`);
            };

            if (window.self === window.top) {
                const hashPage = (window.location.hash || '').replace(/^#/, '');
                const target = hashPage === 'title.html' ? 'title.html' : page;
                toShell(target);
                return;
            }
        })();
    </script>
    <title>ダブルバトル (β版)</title>
    <link rel="stylesheet" href="style.css?v=18" />
    <link rel="stylesheet" href="double_style.css?v=9" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        .title-buttons-container {
            margin-top: 40px !important;
        }
    </style>
</head>

<body>
    <!-- ダブルバトル ロビー画面 -->
    <div id="double-lobby-screen" style="display: block;">
        <div class="phone-box">
            <div class="content">
                <a id="lobby-back-btn" href="#title.html" class="back-to-title-link">←もどる</a>
                <h1>ダブルバトル</h1>

                <div class="mode-select-container">
                    <label class="mode-select-btn active">
                        <input type="radio" name="double_mode" value="1v1_double" checked
                            onchange="updateModeSelection(this)">
                        1人2役
                    </label>
                    <label class="mode-select-btn disabled">
                        <input type="radio" name="double_mode" value="2v2_double" disabled
                            onchange="updateModeSelection(this)">
                        4人対戦 (未開発)
                    </label>
                </div>

                <!-- 特性変更ボタン (シングルバトルと同様のデザイン) -->
                <div id="double-lobby-ability-btn-1" class="lobby-ability-btn">
                    <!-- 左半分: アイコン -->
                    <div
                        style="width: 40%; background: #f9f9f9; display: flex; justify-content: center; align-items: center;">
                        <img id="double-lobby-ability-icon-1" src=""
                            style="width: 80px; height: 80px; object-fit: contain; display: none;">
                    </div>
                    <!-- 右半分: 情報 -->
                    <div
                        style="width: 60%; padding: 12px; display: flex; flex-direction: column; justify-content: center; text-align: left;">
                        <div style="font-size: 0.8rem; color: #888; font-weight: bold; margin-bottom: 2px;">1人目</div>
                        <!-- 右上: 特性名 -->
                        <div id="double-lobby-ability-name-1"
                            style="font-size: 1.2rem; font-weight: 800; color: #333; line-height: 1.2; border-bottom: 2px solid #eee; padding-bottom: 6px; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-clamp: 2; overflow: hidden;">
                        </div>
                        <!-- 右下: 説明 -->
                        <div id="double-lobby-ability-short-desc-1"
                            style="font-size: 0.8rem; color: #666; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; line-clamp: 3; overflow: hidden;">
                        </div>
                    </div>
                </div>

                <div id="double-lobby-ability-btn-2" class="lobby-ability-btn">
                    <!-- 左半分: アイコン -->
                    <div
                        style="width: 40%; background: #f9f9f9; display: flex; justify-content: center; align-items: center;">
                        <img id="double-lobby-ability-icon-2" src=""
                            style="width: 80px; height: 80px; object-fit: contain; display: none;">
                    </div>
                    <!-- 右半分: 情報 -->
                    <div
                        style="width: 60%; padding: 12px; display: flex; flex-direction: column; justify-content: center; text-align: left;">
                        <div style="font-size: 0.8rem; color: #888; font-weight: bold; margin-bottom: 2px;">2人目</div>
                        <!-- 右上: 特性名 -->
                        <div id="double-lobby-ability-name-2"
                            style="font-size: 1.2rem; font-weight: 800; color: #333; line-height: 1.2; border-bottom: 2px solid #eee; padding-bottom: 6px; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-clamp: 2; overflow: hidden;">
                        </div>
                        <!-- 右下: 説明 -->
                        <div id="double-lobby-ability-short-desc-2"
                            style="font-size: 0.8rem; color: #666; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; line-clamp: 3; overflow: hidden;">
                        </div>
                    </div>
                </div>

                <!-- メニューボタン群をコンテナでラップして重なりと間隔を管理 -->
                <div class="title-buttons-container">

                    <!-- ランダムマッチ -->
                    <button id="find-match-double-btn" class="button-lobby" style="margin-bottom: 8px;">ランダムマッチ</button>

                    <!-- CPU戦(デバッグ用) -->
                    <button id="cpu-double-battle-btn" class="button-lobby" style="margin-top: 5px;">コンピュータ戦</button>

                    <hr style="width: 80%; border-top: 1px solid #ccc; margin: 0;">

                    <a id="create-double-room-btn" class="button-lobby">ルーム作成</a>

                    <div class="room-input-group">
                        <input type="text" id="double-room-id-input" placeholder="ルームID"
                            style="flex-grow: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; box-sizing: border-box; min-width: 0;">
                        <button id="join-double-room-btn"
                            style="padding: 10px 16px; border-radius: 8px; border: none; background: linear-gradient(180deg, #81c784, #4caf50); color: white; font-size: 1rem; font-weight: 700; cursor: pointer; white-space: nowrap; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">参加する</button>
                    </div>

                    <div id="lobby-message" style="color: #333; font-weight: bold; text-align: center;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ダブルバトル 対戦画面 (初期非表示) -->
    <div id="double-battle-screen" style="display: none;">
        <div class="phone-box">
            <div class="top-image" id="double-top-image">
                <img src="img/ground.jpg" alt="背景画像" />

                <!-- ＝＝ 自分サイド (左下) ＝＝ -->
                <!-- キャラ表示用コンテナ -->
                <div class="double-char-container bottom-left">
                    <div class="double-ellipse" id="ellipse-ally"></div>
                    <!-- 自キャラA (左・手前) -->
                    <div class="char-wrapper" id="char-p1a-wrapper">
                        <img id="p1a-img-1" class="char-sprite" src="" style="display:none;" />
                        <img id="p1a-img-2" class="char-sprite type2-sprite" src="" style="display:none;" />
                        <div class="double-word" id="p1a-word"></div>
                        <div id="p1a-effect-container" class="effect-container"></div>
                    </div>
                    <!-- 自キャラB (右・奥) -->
                    <div class="char-wrapper" id="char-p1b-wrapper">
                        <img id="p1b-img-1" class="char-sprite" src="" style="display:none;" />
                        <img id="p1b-img-2" class="char-sprite type2-sprite" src="" style="display:none;" />
                        <div class="double-word" id="p1b-word"></div>
                        <div id="p1b-effect-container" class="effect-container"></div>
                    </div>
                </div>

                <!-- 自分サイド情報ウィンドウ (1つのバルーンに統合) -->
                <div class="balloon right double-balloon" id="team1-balloon">
                    <div class="team-info">
                        <div class="member-info">
                            <span class="member-name" id="p1a-name">チーム1A</span>
                            <div class="bar double-hp-box">
                                <div class="ally-hp-bar" id="p1a-hp-bar"></div>
                            </div>
                            <div class="hp double-hp-text" id="p1a-hp-text"></div>
                        </div>
                        <div class="member-info">
                            <span class="member-name" id="p1b-name">チーム1B</span>
                            <div class="bar double-hp-box">
                                <div class="ally-hp-bar" id="p1b-hp-bar"></div>
                            </div>
                            <div class="hp double-hp-text" id="p1b-hp-text"></div>
                        </div>
                    </div>
                </div>

                <!-- ＝＝ 敵サイド (右上) ＝＝ -->
                <!-- キャラ表示用コンテナ -->
                <div class="double-char-container top-right">
                    <div class="double-ellipse" id="ellipse-enemy"></div>
                    <!-- 敵キャラA (左・手前) -->
                    <div class="char-wrapper" id="char-p2a-wrapper">
                        <img id="p2a-img-1" class="char-sprite" src="" style="display:none;" />
                        <img id="p2a-img-2" class="char-sprite type2-sprite" src="" style="display:none;" />
                        <div class="double-word" id="p2a-word"></div>
                        <div id="p2a-effect-container" class="effect-container"></div>
                    </div>
                    <!-- 敵キャラB (右・奥) -->
                    <div class="char-wrapper" id="char-p2b-wrapper">
                        <img id="p2b-img-1" class="char-sprite" src="" style="display:none;" />
                        <img id="p2b-img-2" class="char-sprite type2-sprite" src="" style="display:none;" />
                        <div class="double-word" id="p2b-word"></div>
                        <div id="p2b-effect-container" class="effect-container"></div>
                    </div>
                </div>

                <!-- 敵サイド情報ウィンドウ (1つのバルーンに統合) -->
                <div class="balloon left double-balloon" id="team2-balloon">
                    <div class="team-info">
                        <div class="member-info">
                            <span class="member-name" id="p2a-name">チーム2A</span>
                            <div class="bar double-hp-box">
                                <div class="foe-hp-bar" id="p2a-hp-bar"></div>
                            </div>
                            <div class="hp double-hp-text" id="p2a-hp-text"></div>
                        </div>
                        <div class="member-info">
                            <span class="member-name" id="p2b-name">チーム2B</span>
                            <div class="bar double-hp-box">
                                <div class="foe-hp-bar" id="p2b-hp-bar"></div>
                            </div>
                            <div class="hp double-hp-text" id="p2b-hp-text"></div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- バトル終了後のボタン -->
            <a id="back-to-title-btn" style="display:none;">ロビーに戻る</a>

            <div class="content">
                <!-- アクションエリア -->
                <div class="action-area">
                    <div class="input-wrapper" id="input-wrapper">
                        <div id="timer-container">
                            <div id="timer-bar"></div>
                        </div>
                        <div id="text">
                            <input type="text" id="input" autocomplete="off" placeholder="「」からはじまることば" />
                            <button type="submit" id="submit">▶</button>
                            <div id="prediction-container">
                                <div id="prediction-images">
                                    <img id="include-img" class="include-img" src="" alt="" style="display: none;" />
                                    <img id="include-img-1" class="include-img" src="" alt="" style="display: none;" />
                                    <img id="include-img-2" class="include-img" src="" alt="" style="display: none;" />
                                </div>
                                <div id="prediction-message" class="prediction-message"></div>
                            </div>
                        </div>
                        <div id="message"></div>
                        <div id="wait-message"></div>
                    </div>

                    <!-- ★ 新規追加: ターゲット選択UI (専用の高さ確保ラッパー) -->
                    <div
                        style="height: 46px; display: flex; align-items: center; justify-content: center; margin-top: 6px;">
                        <div id="target-selection-ui"
                            style="display: none; justify-content: center; align-items: center; gap: 12px; padding: 6px 12px; background: rgba(255,255,255,0.7); border-radius: 12px; box-sizing: border-box; width: 85%;">
                            <div style="font-size: 0.9em; font-weight: bold; color: #444;">ターゲット:</div>
                            <button class="target-btn" id="target-p2a-btn">あいてA</button>
                            <button class="target-btn" id="target-p2b-btn">あいてB</button>
                        </div>
                    </div>

                    <!-- アクションボタンエリア -->
                    <div id="actions-wrapper">
                        <div id="situation-button">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="action-btn-icon">
                                <path d="M3 13.125C3 12.5037 3.50368 12 4.125 12H6.75C7.37132 12 7.875 12.5037 7.875 13.125V18.375C7.875 18.9963 7.37132 19.5 6.75 19.5H4.125C3.50368 19.5 3 18.9963 3 18.375V13.125ZM10.125 7.125C10.125 6.50368 10.6287 6 11.25 6H13.875C14.4963 6 15 6.50368 15 7.125V18.375C15 18.9963 14.4963 19.5 13.875 19.5H11.25C10.6287 19.5 10.125 18.9963 10.125 18.375V7.125ZM17.25 3.375C17.25 2.75368 17.7537 2.25 18.375 2.25H21C21.6213 2.25 22.125 2.75368 22.125 3.375V18.375C22.125 18.9963 21.6213 19.5 21 19.5H18.375C17.7537 19.5 17.25 18.9963 17.25 18.375V3.375Z"/>
                            </svg>
                            <p class="action-btn-text">状況</p>
                        </div>
                        <div id="ability-info-container">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="action-btn-icon">
                                <path d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
                            </svg>
                            <p class="action-btn-text">特性</p>
                        </div>
                    </div>
                </div>

                <!-- フッターエリア: ボタン類 -->
                <div class="footer-area">
                    <button id="cancel-battle-btn" style="position: relative; z-index: 100;">にげる</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ダブルバトル用 状況確認モーダル -->
    <div id="situation-modal" style="display: none;">
        <div class="situation-modal-wrapper">
            <h2 style="margin-top: 0; margin-bottom: 15px; font-size: 1.4rem; color: #333;">じょうきょう</h2>

            <div class="situation-cards-container" style="flex-wrap: wrap; justify-content: center; gap: 10px;">
                <!-- 相手チーム (P2A, P2B) -->
                <div class="s-card foe-card" style="width: 45%;">
                    <div class="s-card-header" id="s-p2a-name">あいてA</div>
                    <div class="s-stat-grid">
                        <div class="s-stat-item">
                            <span class="s-stat-label">こうげき</span>
                            <span class="s-stat-value" id="s-p2a-atk">1.0倍</span>
                        </div>
                        <div class="s-stat-item">
                            <span class="s-stat-label">ぼうぎょ</span>
                            <span class="s-stat-value" id="s-p2a-def">1.0倍</span>
                        </div>
                    </div>
                </div>
                <div class="s-card foe-card" style="width: 45%;">
                    <div class="s-card-header" id="s-p2b-name">あいてB</div>
                    <div class="s-stat-grid">
                        <div class="s-stat-item">
                            <span class="s-stat-label">こうげき</span>
                            <span class="s-stat-value" id="s-p2b-atk">1.0倍</span>
                        </div>
                        <div class="s-stat-item">
                            <span class="s-stat-label">ぼうぎょ</span>
                            <span class="s-stat-value" id="s-p2b-def">1.0倍</span>
                        </div>
                    </div>
                </div>

                <!-- 自分チーム (P1A, P1B) -->
                <div class="s-card ally-card" style="width: 45%;">
                    <div class="s-card-header" id="s-p1a-name">じぶんA</div>
                    <div class="s-stat-grid">
                        <div class="s-stat-item">
                            <span class="s-stat-label">こうげき</span>
                            <span class="s-stat-value" id="s-p1a-atk">1.0倍</span>
                        </div>
                        <div class="s-stat-item">
                            <span class="s-stat-label">ぼうぎょ</span>
                            <span class="s-stat-value" id="s-p1a-def">1.0倍</span>
                        </div>
                    </div>
                </div>
                <div class="s-card ally-card" style="width: 45%;">
                    <div class="s-card-header" id="s-p1b-name">じぶんB</div>
                    <div class="s-stat-grid">
                        <div class="s-stat-item">
                            <span class="s-stat-label">こうげき</span>
                            <span class="s-stat-value" id="s-p1b-atk">1.0倍</span>
                        </div>
                        <div class="s-stat-item">
                            <span class="s-stat-label">ぼうぎょ</span>
                            <span class="s-stat-value" id="s-p1b-def">1.0倍</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-actions">
                <button class="modal-btn btn-close" id="close-situation-modal-btn">とじる</button>
            </div>
        </div>
    </div>

    <!-- ダブルバトル用 特性確認モーダル -->
    <div id="ability-modal" style="display: none;">
        <!-- モーダルメッセージ -->
        <div id="double-modal-message"></div>
        <!-- 自分チームのとくせい (選択可能) -->
        <div style="margin-bottom: 12px;">
            <div id="ability-tab-p1a" class="ability-tab-content">
                <div style="margin-bottom: 6px;">
                    <span style="font-weight:bold;" id="a-p1a-name">チーム1A</span>
                    <span class="tokusei-name" id="a-p1a-ability-name"
                        style="color:#ff5722;font-weight:bold;margin-left:8px;">---</span>
                </div>
                <div class="tokusei-desc" id="a-p1a-ability-desc" style="font-size:0.8em;color:#666;margin-bottom:6px;">
                </div>
                <div style="font-size:0.85em;color:#888;">タップしてとくせいを変える <span id="a-p1a-remain">(あと0回)</span></div>
                <div id="a-p1a-skills" class="double-skills-list"></div>
            </div>
            <div id="ability-tab-p1b" class="ability-tab-content" style="display:none;">
                <div style="margin-bottom: 6px;">
                    <span style="font-weight:bold;" id="a-p1b-name">チーム1B</span>
                    <span class="tokusei-name" id="a-p1b-ability-name"
                        style="color:#ff5722;font-weight:bold;margin-left:8px;">---</span>
                </div>
                <div class="tokusei-desc" id="a-p1b-ability-desc" style="font-size:0.8em;color:#666;margin-bottom:6px;">
                </div>
                <div style="font-size:0.85em;color:#888;">タップしてとくせいを変える <span id="a-p1b-remain">(あと0回)</span></div>
                <div id="a-p1b-skills" class="double-skills-list"></div>
            </div>

            <div style="display: flex; gap: 8px; margin-top: 15px;">
                <button class="char-tab active" id="tab-p1a" onclick="switchAbilityTab('p1a')">チーム1A</button>
                <button class="char-tab" id="tab-p1b" onclick="switchAbilityTab('p1b')">チーム1B</button>
            </div>
        </div>

        <div class="close-modal" id="close-ability-modal-btn">とじる</div>
    </div>

    <!-- ロビー用 特性選択モーダル (ダブルバトル用) -->
    <div id="double-lobby-ability-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center;">
        <div
            style="background: white; width: 90%; max-width: 420px; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 15px; max-height: 80vh;">
            <h3 style="margin: 0; text-align: center;">とくせいを選択</h3>
            <div id="double-lobby-ability-desc"
                style="font-size: 0.9rem; color: #666; background: #f5f5f5; padding: 10px; border-radius: 8px; min-height: 3em;">
            </div>
            <div id="double-lobby-abilities-list"
                style="display: flex; flex-wrap: wrap; gap: 8px; overflow-y: auto; padding: 5px; flex: 1; justify-content: center;">
                <!-- JSで生成 -->
            </div>
            <button id="close-double-lobby-ability-modal"
                style="padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">決定</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/wanakana"></script>
    <script src="type_to_image.js"></script>
    <script src="shared_audio.js"></script>
    <script src="audio_bridge.js"></script>
    <!-- UIとベースロジックを流用 -->
    <script src="UIObject.js"></script>
    <script>
        function navigateInShell(page) {
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'sb:navigate', page }, '*');
                    return;
                }
            } catch (e) {
                // noop
            }
            window.location.href = `index.html#${page}`;
        }

        function updateModeSelection(radio) {
            document.querySelectorAll('.mode-select-btn').forEach(lbl => lbl.classList.remove('active'));
            if (radio.checked) {
                radio.closest('.mode-select-btn').classList.add('active');
            }

            const content = document.querySelector('#double-lobby-screen .content');
            const btn2 = document.getElementById('double-lobby-ability-btn-2');
            if (btn2) {
                if (radio.value === '1v1_double') {
                    btn2.style.display = 'flex';
                    if (content) content.classList.remove('mode-2v2');
                } else {
                    btn2.style.display = 'none';
                    if (content) content.classList.add('mode-2v2');
                }
            }
        }

        // 初期ロード時にモード選択状態を反映
        document.addEventListener('DOMContentLoaded', () => {
            const checked = document.querySelector('input[name="double_mode"]:checked');
            if (checked) updateModeSelection(checked);
        });

        const lobbyBackBtn = document.getElementById('lobby-back-btn');
        if (lobbyBackBtn) {
            lobbyBackBtn.addEventListener('click', (e) => {
                e.preventDefault();
                navigateInShell('title.html');
            });
        }
    </script>
    <script src="double_UI.js?v=20"></script>
    <script src="double_script.js?v=13"></script>

</body>

</html>
