<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function ensureIframeShellEarly() {
      const page = 'single_battle.html';
      const toShell = (targetPage) => {
        window.location.replace(`index.html#${targetPage}`);
      };

      if (window.self === window.top) {
        const hashPage = (window.location.hash || '').replace(/^#/, '');
        const target = hashPage === 'double_battle.html' ? 'double_battle.html' : page;
        toShell(target);
        return;
      }
      try {
        if (window.parent && window.parent.location.hash !== `#${page}`) {
          window.parent.location.hash = page;
        }
      } catch (e) {
        // noop
      }
    })();
  </script>
  <title>しりとりの対戦バトル</title>
  <link rel="stylesheet" href="style.css?v=10" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="type_to_image.js"></script>
  <script src="UIObject.js"></script>
  <script src="UI.js"></script>
  <script src="shared_audio.js"></script>
  <script src="script.js"></script>
</head>

<body>
  <!-- タイトル画面 -->
  <div id="title-screen" style="display: block;">
    <div class="phone-box">
      <div class="content">
        <p>機能を色々追加したい</p>
        <h1>しりとりの対戦バトル (β版)</h1>
        <!-- メニューボタン群をコンテナでラップして重なりと間隔を管理 -->
        <!-- トップメニュー -->
        <div id="top-menu-container" class="title-buttons-container">
          <button id="to-single-menu-btn" class="button-lobby">シングルバトル</button>
          <a href="#double_battle.html" id="go-double-battle-btn" class="button-lobby"
            style="background: linear-gradient(180deg, #ff9a9e, #fecfef);">ダブルバトル</a>
          <button id="settings-btn" class="button-lobby"
            style="background: linear-gradient(180deg, #f0f0f0, #d4d4d4); color: #333;">設定</button>
        </div>

        <!-- シングルバトルメニュー (初期非表示) -->
        <div id="single-menu-container" class="title-buttons-container" style="display: none;">
          <a id="vs-cpu-btn">コンピュータ戦</a>
          <hr style="width: 80%; border-top: 1px solid #ccc; margin: 0;">
          <a id="create-room-btn">ルーム作成</a>
          <div style="display: flex; gap: 8px; align-items: center; width: 72%; max-width: 340px;">
            <input type="text" id="room-id-input" placeholder="ルームID"
              style="flex-grow: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem;">
            <button id="join-room-btn"
              style="padding: 10px 16px; border-radius: 8px; border: none; background: linear-gradient(180deg, #81c784, #4caf50); color: white; font-weight: 700; font-size: 1rem; cursor: pointer; white-space: nowrap; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">参加する</button>
          </div>
          <hr style="width: 80%; border-top: 1px solid #ccc; margin: 0;">
          <button id="back-to-top-btn" class="button-lobby" style="background: #e0e0e0; color: #333;">戻る</button>
        </div>
      </div>
    </div>
  </div>

  <!-- バトル画面 (初期非表示) -->
  <div id="battle-screen" style="display: none;">
    <div class="phone-box">
      <div class="top-image">
        <img src="img/ground.jpg" alt="背景画像" />

        <!-- 白い楕円（左下） -->
        <div class="ellipse ellipse-left"></div>

        <!-- 右下ふきだし -->
        <div class="balloon right">
          <div class="ally-name"></div>
          <div class="bar">
            <div class="ally-hp-bar"></div>
          </div>
          <div class="hp"></div>
        </div>

        <!-- エフェクト用コンテナ (キャラの背後に表示するため z-index を調整) -->
        <div id="ally-effect-container" class="effect-container"></div>
        <div id="foe-effect-container" class="effect-container"></div>

        <img id="ally-type1-img" src="" />
        <img id="ally-type2-img" src="" />
        <img id="ally-only-type-img" src="" />
        <div class="ally-word"></div>

        <!-- 白い楕円（右上） -->
        <div class="ellipse ellipse-right"></div>

        <!-- 左上ふきだし -->
        <div class="balloon left">
          <div class="foe-name"></div>
          <div class="bar">
            <div class="foe-hp-bar"></div>
          </div>
          <div class="hp"></div>
        </div>

        <img id="foe-type1-img" src="" />
        <img id="foe-type2-img" src="" />
        <img id="foe-only-type-img" src="" />
        <div class="foe-word"></div>
      </div>

      <div class="content">
        <!-- アクションエリア: タイマー、メッセージ、入力 -->
        <div class="action-area">
          <div class="input-wrapper">
            <div id="timer-container">
              <div id="timer-bar"></div>
            </div>
            <div id="text">
              <input type="text" id="input" autocomplete="off" placeholder="「」からはじまることば" />
              <button type="submit" id="submit">▶</button>
              <img id="include-img" src="" alt="動的画像" />
            </div>
            <div id="message"></div>
            <div id="wait-message"></div>
          </div>
          <!-- アクションボタンエリア -->
          <div id="actions-wrapper">
            <div id="situation-button" class="button">
              <p>じょうきょう</p>
            </div>
            <div id="ability-info-container">
              <p>とくせい</p>
            </div>
          </div>
        </div>
        <a id="back-to-title-btn" style="display:none;">タイトルに戻る</a>
        <!-- フッターエリア: ボタン類 -->
        <div class="footer-area">
          <button id="cancel-battle-btn">にげる</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="settings-modal"
    style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center;">
    <div
      style="background: white; width: 90%; max-width: 420px; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 15px; max-height: 90vh;">
      <h2 style="margin: 0; text-align: center;">設定</h2>

      <div>
        <label for="username-input" style="display: block; margin-bottom: 5px; font-weight: bold;">名前</label>
        <input type="text" id="username-input" placeholder="名前を入力(8文字以内)" maxlength="8"
          style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; box-sizing: border-box;">
      </div>

      <!-- 音量調整スライダー -->
      <div>
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">BGM音量</label>
        <input type="range" id="bgm-slider" min="0" max="1" step="0.05" value="0.3" style="width: 100%;">
      </div>
      <div>
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">SE音量</label>
        <input type="range" id="se-slider" min="0" max="1" step="0.05" value="0.5" style="width: 100%;">
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; flex-shrink: 0;">
        <button id="close-settings-btn"
          style="padding: 10px 20px; border-radius: 8px; border: none; background: #4CAF50; color: white; cursor: pointer;">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    // メニュー遷移ロジック
    const topMenu = document.getElementById('top-menu-container');
    const singleMenu = document.getElementById('single-menu-container');
    const toSingleBtn = document.getElementById('to-single-menu-btn');
    const backToTopBtn = document.getElementById('back-to-top-btn');

    if (toSingleBtn) {
      toSingleBtn.addEventListener('click', () => {
        topMenu.style.display = 'none';
        singleMenu.style.display = 'flex';
      });
    }
    if (backToTopBtn) {
      backToTopBtn.addEventListener('click', () => {
        singleMenu.style.display = 'none';
        topMenu.style.display = 'flex';
      });
    }

    // 設定モーダル制御
    const settingsBtn = document.getElementById('settings-btn');
    const settingsModal = document.getElementById('settings-modal');
    const closeSettingsBtn = document.getElementById('close-settings-btn');
    const usernameInput = document.getElementById('username-input');
    const bgmSlider = document.getElementById('bgm-slider');
    const seSlider = document.getElementById('se-slider');

    // 初期ロード
    const savedName = localStorage.getItem("sb_username");
    if (savedName) usernameInput.value = savedName;

    settingsBtn.addEventListener('click', () => {
      settingsModal.style.display = 'flex';
    });

    closeSettingsBtn.addEventListener('click', () => {
      const name = usernameInput.value.trim();
      if (name) localStorage.setItem("sb_username", name);
      settingsModal.style.display = 'none';
    });

    // 音量スライダーのイベント
    bgmSlider.addEventListener('input', (e) => {
      if (window.parent && window.parent.SB_AUDIO) window.parent.SB_AUDIO.setBGMVolume(parseFloat(e.target.value));
      else if (window.SB_AUDIO) window.SB_AUDIO.setBGMVolume(parseFloat(e.target.value));
    });
    seSlider.addEventListener('input', (e) => {
      if (window.parent && window.parent.SB_AUDIO) window.parent.SB_AUDIO.setSEVolume(parseFloat(e.target.value));
      else if (window.SB_AUDIO) window.SB_AUDIO.setSEVolume(parseFloat(e.target.value));
    });

    // バトル開始ボタンのイベントリスナー
    document.getElementById('vs-cpu-btn').addEventListener('click', () => startBattle('cpu'));
    document.getElementById('create-room-btn').addEventListener('click', () => startBattle('room', null));

    document.getElementById('join-room-btn').addEventListener('click', () => {
      const roomId = document.getElementById('room-id-input').value;
      if (roomId && roomId.trim() !== '') {
        startBattle('room', roomId.trim());
      } else {
        alert('ルームIDを入力してください。');
      }
    });

    const navigateInShell = (page) => {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'sb:navigate', page }, '*');
          return;
        }
      } catch (e) {
        // noop
      }
      window.location.href = `index.html#${page}`;
    };

    const goDoubleBattleBtn = document.getElementById('go-double-battle-btn');
    if (goDoubleBattleBtn) {
      goDoubleBattleBtn.addEventListener('click', (e) => {
        e.preventDefault();
        navigateInShell('double_battle.html');
      });
    }

    // ユーザー操作時に再生を試みる（ブラウザの自動再生制限対策）
    let isAudioUnlocked = false;
    const userInteractionHandler = () => {
      if (isAudioUnlocked) return;
      isAudioUnlocked = true;

      try {
        if (window.parent && window.parent !== window && window.parent.SB_AUDIO) {
          window.parent.SB_AUDIO.unlockAudioContext();
          window.parent.SB_AUDIO.startBGM('resource/horizon.mp3');
          return;
        }
      } catch (e) {
        // noop
      }

      if (typeof startBGM === 'function') startBGM('resource/horizon.mp3');
      if (typeof unlockAudioContext === 'function') unlockAudioContext();
    };

    document.body.addEventListener('click', userInteractionHandler, { once: true });
    document.body.addEventListener('touchstart', userInteractionHandler, { once: true });
  </script>
</body>

</html>
