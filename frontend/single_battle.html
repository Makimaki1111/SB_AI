<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function ensureIframeShellEarly() {
      const page = 'single_battle.html';
      const toShell = (targetPage) => {
        window.location.replace(`index.html#${targetPage}`);
      };

      if (window.self === window.top) {
        const hashPage = (window.location.hash || '').replace(/^#/, '');
        const target = hashPage === 'title.html' ? 'title.html' : page;
        toShell(target);
        return;
      }
      try {
        if (window.parent && window.parent.location.hash !== `#${page}`) {
          window.parent.location.hash = page;
        }
      } catch (e) {
        // noop
      }
    })();
  </script>
  <title>しりとりの対戦バトル</title>
  <link rel="stylesheet" href="style.css?v=10" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="type_to_image.js"></script>
  <script src="UIObject.js"></script>
  <script src="UI.js"></script>
  <script src="shared_audio.js"></script>
  <script src="script.js"></script>
</head>

<body>
  <!-- シングルバトル ロビー画面 (IDはtitle-screenを流用してスタイルを維持) -->
  <div id="title-screen" class="single-lobby-screen" style="display: block;">
    <div class="phone-box">
      <div class="content">
        <a id="back-to-title-btn-lobby" class="back-to-title-link">←もどる</a>
        <h1>シングルバトル</h1>

        <!-- シングルバトルメニュー -->
        <div id="single-menu-container" class="title-buttons-container">
          <a id="vs-cpu-btn">コンピュータ戦</a>
          <hr style="width: 80%; border-top: 1px solid #ccc; margin: 0;">
          <a id="create-room-btn">ルーム作成</a>
          <div style="display: flex; gap: 8px; align-items: center; width: 72%; max-width: 340px;">
            <input type="text" id="room-id-input" placeholder="ルームID"
              style="flex-grow: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem;">
            <button id="join-room-btn"
              style="padding: 10px 16px; border-radius: 8px; border: none; background: linear-gradient(180deg, #81c784, #4caf50); color: white; font-weight: 700; font-size: 1rem; cursor: pointer; white-space: nowrap; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">参加する</button>
          </div>
          <hr style="width: 80%; border-top: 1px solid #ccc; margin: 0;">
        </div>
      </div>
    </div>
  </div>

  <!-- バトル画面 (初期非表示) -->
  <div id="battle-screen" style="display: none;">
    <div class="phone-box">
      <a id="back-to-title-btn" class="back-to-title-link" style="display:none;">←もどる</a>
      <div class="top-image">
        <img src="img/ground.jpg" alt="背景画像" />

        <!-- 白い楕円（左下） -->
        <div class="ellipse ellipse-left"></div>

        <!-- 右下ふきだし -->
        <div class="balloon right">
          <div class="ally-name"></div>
          <div class="bar">
            <div class="ally-hp-bar"></div>
          </div>
          <div class="hp"></div>
        </div>

        <!-- エフェクト用コンテナ (キャラの背後に表示するため z-index を調整) -->
        <div id="ally-effect-container" class="effect-container"></div>
        <div id="foe-effect-container" class="effect-container"></div>

        <img id="ally-type1-img" src="" />
        <img id="ally-type2-img" src="" />
        <img id="ally-only-type-img" src="" />
        <div class="ally-word"></div>

        <!-- 白い楕円（右上） -->
        <div class="ellipse ellipse-right"></div>

        <!-- 左上ふきだし -->
        <div class="balloon left">
          <div class="foe-name"></div>
          <div class="bar">
            <div class="foe-hp-bar"></div>
          </div>
          <div class="hp"></div>
        </div>

        <img id="foe-type1-img" src="" />
        <img id="foe-type2-img" src="" />
        <img id="foe-only-type-img" src="" />
        <div class="foe-word"></div>
      </div>

      <div class="content">
        <!-- アクションエリア: タイマー、メッセージ、入力 -->
        <div class="action-area">
          <div class="input-wrapper">
            <div id="timer-container">
              <div id="timer-bar"></div>
            </div>
            <div id="text">
              <input type="text" id="input" autocomplete="off" placeholder="「」からはじまることば" />
              <button type="submit" id="submit">▶</button>
              <img id="include-img" src="" alt="動的画像" />
            </div>
            <div id="message"></div>
            <div id="wait-message"></div>
          </div>
          <!-- アクションボタンエリア -->
          <div id="actions-wrapper">
            <div id="situation-button" class="button">
              <p>じょうきょう</p>
            </div>
            <div id="ability-info-container">
              <p>とくせい</p>
            </div>
          </div>
        </div>
        <!-- フッターエリア: ボタン類 -->
        <div class="footer-area">
          <button id="cancel-battle-btn">にげる</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // バトル開始ボタンのイベントリスナー
    document.getElementById('vs-cpu-btn').addEventListener('click', () => startBattle('cpu'));
    document.getElementById('create-room-btn').addEventListener('click', () => startBattle('room', null));

    document.getElementById('join-room-btn').addEventListener('click', () => {
      const roomId = document.getElementById('room-id-input').value;
      if (roomId && roomId.trim() !== '') {
        startBattle('room', roomId.trim());
      } else {
        alert('ルームIDを入力してください。');
      }
    });

    const navigateInShell = (page) => {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'sb:navigate', page }, '*');
          return;
        }
      } catch (e) {
        // noop
      }
      window.location.href = `index.html#${page}`;
    };

    const backToTitleBtnLobby = document.getElementById('back-to-title-btn-lobby');
    if (backToTitleBtnLobby) {
      backToTitleBtnLobby.addEventListener('click', (e) => {
        e.preventDefault();
        navigateInShell('title.html');
      });
    }

    // ユーザー操作時に再生を試みる（ブラウザの自動再生制限対策）
    let isAudioUnlocked = false;
    const userInteractionHandler = () => {
      if (isAudioUnlocked) return;
      isAudioUnlocked = true;

      try {
        if (window.parent && window.parent !== window && window.parent.SB_AUDIO) {
          window.parent.SB_AUDIO.unlockAudioContext();
          window.parent.SB_AUDIO.startBGM('resource/horizon.mp3');
          return;
        }
      } catch (e) {
        // noop
      }

      if (typeof startBGM === 'function') startBGM('resource/horizon.mp3');
      if (typeof unlockAudioContext === 'function') unlockAudioContext();
    };

    document.body.addEventListener('click', userInteractionHandler, { once: true });
    document.body.addEventListener('touchstart', userInteractionHandler, { once: true });
  </script>
</body>

</html>
