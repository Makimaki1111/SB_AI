<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIタイプ付けしりとりバトル</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- タイトル画面 -->
  <div id="title-screen" style="display: block;">
    <div class="phone-box">
      <div class="content">
        <p>AIでタイプをつけた</p>
        <h1>しりとりバトル (α版)</h1>
        <!-- ボタンをbattle.htmlへのリンクに変更 -->
        <a href="battle.html?mode=player" id="vs-player-btn">ランダムマッチ</a>
        <a href="battle.html?mode=cpu" id="vs-cpu-btn">コンピュータ戦</a>
        <hr style="width: 80%; border-top: 1px solid #ccc; margin: 1rem 0;">
        <a href="battle.html?mode=room" id="create-room-btn">ルーム作成</a>
        <div style="display: flex; gap: 8px; align-items: center; width: 72%; max-width: 340px; margin-top: 8px;">
          <input type="text" id="room-id-input" placeholder="ルームID" style="flex-grow: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem;">
          <button id="join-room-btn" style="padding: 10px 16px; border-radius: 8px; border: none; background-color: #4CAF50; color: white; font-size: 1rem; cursor: pointer;">参加する</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('join-room-btn').addEventListener('click', () => {
        const roomId = document.getElementById('room-id-input').value;
        if (roomId && roomId.trim() !== '') {
            window.location.href = `battle.html?mode=room&roomId=${roomId.trim()}`;
        } else {
            alert('ルームIDを入力してください。');
        }
    });
  </script>
</body>
</html>
