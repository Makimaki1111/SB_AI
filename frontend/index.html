<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>しりとりの対戦バトル</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #fff;
      position: absolute;
      top: 0;
      left: 0;
    }
    iframe.active {
      display: block;
    }
  </style>
</head>
<body>
  <script src="shared_audio.js"></script>
  <iframe id="title-frame" src="title.html" allow="autoplay" title="Title"></iframe>
  <iframe id="single-frame" src="single_battle.html" allow="autoplay" title="Single Battle"></iframe>
  <iframe id="double-frame" src="double_battle.html" allow="autoplay" title="Double Battle"></iframe>
  <script>
    let sbAudioUnlocked = false;
    let pendingBgmPath = null;

    function requestRootBGM(path) {
      if (!path) return;
      if (!sbAudioUnlocked) {
        pendingBgmPath = path;
        return;
      }
      if (window.SB_AUDIO && typeof window.SB_AUDIO.startBGM === "function") {
        window.SB_AUDIO.startBGM(path);
      }
    }

    (function bindFrameRoute() {
      // リロード時にハッシュを削除してタイトルから開始させる
      if (window.location.hash) {
        history.replaceState(null, null, window.location.pathname);
      }

      const frames = {
        "title.html": document.getElementById("title-frame"),
        "single_battle.html": document.getElementById("single-frame"),
        "double_battle.html": document.getElementById("double-frame")
      };
      const allowedPages = new Set(["title.html", "single_battle.html", "double_battle.html"]);

      const resolvePage = () => {
        const raw = (window.location.hash || "").replace(/^#/, "");
        const decoded = raw ? decodeURIComponent(raw) : "";
        const basePage = decoded.split('?')[0];
        return allowedPages.has(basePage) ? decoded : "title.html";
      };

      const applyRoute = () => {
        const page = resolvePage();
        const basePage = page.split('?')[0];
        
        // すべてのフレームを非表示
        Object.values(frames).forEach(f => f.classList.remove('active'));
        
        // 対象のフレームを表示
        if (frames[basePage]) {
          const f = frames[basePage];
          // クエリパラメータが異なる場合はsrcを更新して再読み込み
          const currentSrc = f.getAttribute('src');
          if (currentSrc !== page) {
            f.setAttribute('src', page);
          }
          f.classList.add('active');
          // アクティブになったことを通知
          f.contentWindow.postMessage({ type: 'sb:activated' }, '*');
        }
      };

      window.addEventListener("message", (event) => {
        const data = event && event.data;
        if (!data) return;

        if (data.type === "sb:navigate") {
          const page = data.page;
          const basePage = page.split('?')[0];
          if (!allowedPages.has(basePage)) return;
          if (window.location.hash !== `#${page}`) {
            window.location.hash = page;
          }
          return;
        }

        if (data.type === "sb:request_bgm") {
          requestRootBGM(data.path);
          return;
        }

        if (data.type && data.type.startsWith("sb:audio:")) {
          const method = data.type.replace("sb:audio:", "");
          if (!window.SB_AUDIO || typeof window.SB_AUDIO[method] !== "function") {
            return;
          }
          if (method === "unlockAudioContext") {
            sbAudioUnlocked = true;
          }
          window.SB_AUDIO[method](...(data.args || []));
        }
      });

      window.addEventListener("hashchange", applyRoute);
      applyRoute();
    })();

    (function bindAudioUnlock() {
      let unlocked = false;

      const handler = () => {
        if (unlocked) return;
        unlocked = true;
        sbAudioUnlocked = true;
        if (window.SB_AUDIO) {
          window.SB_AUDIO.unlockAudioContext();
        }
        requestRootBGM(pendingBgmPath || "resource/horizon.mp3");
        pendingBgmPath = null;
      };

      document.addEventListener("click", handler, { once: true });
      document.addEventListener("touchstart", handler, { once: true });
      document.addEventListener("keydown", handler, { once: true });
    })();
  </script>
</body>
</html>
