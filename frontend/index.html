<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スマホ画面デザイン</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone-box">
    <div class="top-image">
      <img src="img/ground.jpg" alt="背景画像" />

      <!-- 白い楕円（左下） -->
      <div class="ellipse ellipse-left"></div>

      <!-- 白い楕円（右上） -->
      <div class="ellipse ellipse-right"></div>

      <!-- 左上ふきだし -->
      <div class="balloon left">
        <div class="name">あいて</div>
        <div class="bar"><div class="hp-bar"></div></div>
        <div class="hp">40/40</div>
      </div>

      <!-- 右下ふきだし -->
      <div class="balloon right">
        <div class="name">じぶん</div>
        <div class="bar"><div class="hp-bar"></div></div>
        <div class="hp">40/40</div>
      </div>

      <img id="ally-type1-img" src=""/>
      <img id="ally-type2-img" src=""/>
    </div>

    <div class="content">
      <!-- 下半分のスペース -->
      <img id="include-img" src="" alt="動的画像" />
      
      <div id="text" style="display: flex;">
        <input type="text" id="input" autocomplete="off" placeholder="「*」からはじまることば" style>
        <button type="submit" id="submit">!!!</button>
      </div>
    </div>
  </div>
<script src="script.js"></script>
</body>
</html>
