<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>しりとりの対戦バトル</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #fff;
      position: absolute;
      top: 0;
      left: 0;
    }
    iframe.active {
      display: block;
    }
  </style>
</head>
<body>
  <script src="shared_audio.js"></script>
  <iframe id="title-frame" src="title.html" allow="autoplay" title="Title"></iframe>
  <iframe id="single-frame" src="single_battle.html" allow="autoplay" title="Single Battle"></iframe>
  <iframe id="double-frame" src="double_battle.html" allow="autoplay" title="Double Battle"></iframe>
  <script>
    (function bindFrameRoute() {
      // リロード時にハッシュを削除してタイトルから開始させる
      if (window.location.hash) {
        history.replaceState(null, null, window.location.pathname);
      }

      const frames = {
        "title.html": document.getElementById("title-frame"),
        "single_battle.html": document.getElementById("single-frame"),
        "double_battle.html": document.getElementById("double-frame")
      };
      const allowedPages = new Set(["title.html", "single_battle.html", "double_battle.html"]);

      const resolvePage = () => {
        const raw = (window.location.hash || "").replace(/^#/, "");
        const decoded = raw ? decodeURIComponent(raw) : "";
        return allowedPages.has(decoded) ? decoded : "title.html";
      };

      const applyRoute = () => {
        const page = resolvePage();
        
        // すべてのフレームを非表示
        Object.values(frames).forEach(f => f.classList.remove('active'));
        
        // 対象のフレームを表示
        if (frames[page]) {
          frames[page].classList.add('active');
          // アクティブになったことを通知
          frames[page].contentWindow.postMessage({ type: 'sb:activated' }, '*');
        }
      };

      window.addEventListener("message", (event) => {
        const data = event && event.data;
        if (!data || data.type !== "sb:navigate") return;
        const page = data.page;
        if (!allowedPages.has(page)) return;
        if (window.location.hash !== `#${page}`) {
          window.location.hash = page;
        }
      });

      window.addEventListener("hashchange", applyRoute);
      applyRoute();
    })();

    (function bindAudioUnlock() {
      let unlocked = false;

      const handler = () => {
        if (unlocked) return;
        unlocked = true;
        if (window.SB_AUDIO) {
          window.SB_AUDIO.unlockAudioContext();
          window.SB_AUDIO.startBGM("resource/horizon.mp3");
        }
      };

      document.addEventListener("click", handler, { once: true });
      document.addEventListener("touchstart", handler, { once: true });
      document.addEventListener("keydown", handler, { once: true });
    })();
  </script>
</body>
</html>
