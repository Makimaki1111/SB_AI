<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スマホ画面デザイン</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone-box">
    <div class="top-image">
      <img src="img/ground.jpg" alt="背景画像" />

      <!-- 白い楕円（左下） -->
      <div class="ellipse ellipse-left"></div>

      <!-- 白い楕円（右上） -->
      <div class="ellipse ellipse-right"></div>

      <!-- 左上ふきだし -->
      <div class="balloon left">
        <div class="name">あいて</div>
        <div class="hp">40/40</div>
        <div class="bar"><div class="hp-bar"></div></div>
      </div>

      <!-- 右下ふきだし -->
      <div class="balloon right">
        <div class="name">れんしゅう</div>
        <div class="hp">40/40</div>
        <div class="bar"><div class="hp-bar"></div></div>
      </div>
    </div>

    <div class="content">
      <!-- 下半分のスペース -->
    </div>
  </div>
</body>
</html>
