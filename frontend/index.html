<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>しりとりの対戦バトル</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #fff;
    }
  </style>
</head>
<body>
  <script src="shared_audio.js"></script>
  <iframe id="app-frame" src="single_battle.html" allow="autoplay" title="Shiritori Battle"></iframe>
  <script>
    (function bindFrameRoute() {
      const frame = document.getElementById("app-frame");
      const allowedPages = new Set(["single_battle.html", "double_battle.html"]);

      const resolvePage = () => {
        const raw = (window.location.hash || "").replace(/^#/, "");
        const decoded = raw ? decodeURIComponent(raw) : "";
        return allowedPages.has(decoded) ? decoded : "single_battle.html";
      };

      const applyRoute = () => {
        const page = resolvePage();
        if (frame.getAttribute("src") !== page) {
          frame.setAttribute("src", page);
        }
      };

      window.addEventListener("message", (event) => {
        const data = event && event.data;
        if (!data || data.type !== "sb:navigate") return;
        const page = data.page;
        if (!allowedPages.has(page)) return;
        if (frame.getAttribute("src") !== page) {
          frame.setAttribute("src", page);
        }
        if (window.location.hash !== `#${page}`) {
          window.location.hash = page;
        }
      });

      window.addEventListener("hashchange", applyRoute);
      applyRoute();
    })();

    (function bindAudioUnlock() {
      let unlocked = false;

      const handler = () => {
        if (unlocked) return;
        unlocked = true;
        if (window.SB_AUDIO) {
          window.SB_AUDIO.unlockAudioContext();
        }
      };

      document.addEventListener("click", handler, { once: true });
      document.addEventListener("touchstart", handler, { once: true });
      document.addEventListener("keydown", handler, { once: true });
    })();
  </script>
</body>
</html>
